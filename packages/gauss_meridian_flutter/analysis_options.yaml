include: package:lints/recommended.yaml

analyzer:
  exclude:
    - build/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    - prefer_single_quotes
    - always_declare_return_types
    - prefer_final_locals
    - prefer_final_fields
    - avoid_dynamic_calls
    - unawaited_futures
    - directives_ordering
    - avoid_print
    - only_throw_errors
    - cancel_subscriptions
    - close_sinks
    - public_member_api_docs
